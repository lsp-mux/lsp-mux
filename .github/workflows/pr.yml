---
jobs:
  changeset:
    name: Changeset
    uses: gtbuchanan/tooling/.github/workflows/changeset-check.yml@main
  ci:
    name: CI
    # Explicit pass, not `inherit`: inherit only forwards secrets to reusable
    # workflows in the same org/enterprise, and tooling is a different owner.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    uses: gtbuchanan/tooling/.github/workflows/ci.yml@main
    with:
      # config-default installs its tarballs and drives the real servers; the
      # proxy integration suite is the slow bucket.
      run-e2e: true
      run-slow-tests: true
  dependencies:
    name: Dependencies
    uses: gtbuchanan/tooling/.github/workflows/dependency-review.yml@main
  pre-commit:
    name: Pre-Commit
    uses: gtbuchanan/tooling/.github/workflows/pre-commit.yml@main
    with:
      # `registry/src/index.ts` imports `./entries.generated.ts`, which is
      # git-ignored, so in a fresh checkout that import resolves to the
      # `error` type and eslint's type-aware rules fire on code that is
      # fine. Turbo's own task graph orders this; hk lints the changed
      # files directly and would otherwise read the tree before codegen.
      pnpm-commands: exec turbo run generate
      # The hk eslint step shells out to `pnpm exec eslint`, so hk needs
      # the project's deps installed.
      use-pnpm: true
name: PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write # Dependencies posts a PR comment
